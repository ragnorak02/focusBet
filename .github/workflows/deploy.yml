name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by odds.yml. A commit pushed with GITHUB_TOKEN deliberately does not
  # start another workflow run, so the odds job can't rely on its own push to
  # trigger the deploy above — it calls this instead.
  workflow_call:
    inputs:
      ref:
        description: 'Branch or commit to build. Defaults to whatever triggered the run.'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Empty means "the SHA that triggered this run", which is what every
          # trigger but workflow_call wants. The odds job passes the branch so
          # the build picks up the commit it has just pushed.
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Served from https://<user>.github.io/<repo>, so assets and the runtime
      # odds.json fetch both need that prefix.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # Without this, Pages runs the output through Jekyll and drops _next/.
      - run: touch out/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Pull odds

# The board reads public/odds.json, so keeping lines current is a commit. This
# is what makes that commit, every two hours, without anyone opening a book.
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      books:
        description: 'Book preference, highest first'
        required: false
        default: 'FanDuel,Kalshi,DraftKings,BetRivers,Caesars,BetMGM,BetWay,Unibet,Polymarket'

permissions:
  contents: write

concurrency:
  group: odds
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the scraper is dependency-free on purpose.
      - run: node scripts/pull-odds.mjs
        env:
          ODDS_BOOKS: ${{ github.event.inputs.books }}

      # The script leaves the file untouched when no line moved, so an
      # unchanged tree here means there is genuinely nothing to publish.
      - name: Commit if anything moved
        id: commit
        run: |
          if [ -z "$(git status --porcelain public/odds.json)" ]; then
            echo "No line moved."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/odds.json
          git commit -m "Refresh odds from BestFightOdds"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # The commit above is pushed with GITHUB_TOKEN, and GitHub deliberately does
  # not start a workflow run from those — otherwise new lines would sit in the
  # repo unpublished until a person happened to push something.
  deploy:
    needs: pull
    if: needs.pull.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ github.ref_name }}
